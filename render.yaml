services:
  - type: web
    name: delivery-system-do
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SQLITE_PATH
        value: /var/data/delivery-db.sqlite
    disks:
      - name: delivery-data
        mountPath: /var/data
        sizeGB: 1